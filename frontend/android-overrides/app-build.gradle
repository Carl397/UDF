apply plugin: 'com.android.application'

// Release signing is loaded from android/keystore.properties (git-ignored).
// See keystore.properties.example for the required keys. When the file is
// absent, the release build is produced UNSIGNED (dev/CI convenience) — a real
// release must be signed, so the deploy runbook generates the keystore first.
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (!keystorePropertiesFile.exists()) {
    keystorePropertiesFile = rootProject.file('../../secrets/android/keystore.properties')
}
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }) {
        if (!keystorePropertiesFile.exists() ||
            ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].any { !keystoreProperties[it] } ||
            !rootProject.file(keystoreProperties['storeFile']).isFile()) {
            throw new GradleException('Release signing is required. Configure the existing upload key; never ship an unsigned or debug-signed release.')
        }
    }
}

android {
    namespace "com.udf.party"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.udf.party"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.0.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Release must never be debuggable.
            debuggable false
            // Shrink + obfuscate. Capacitor libraries ship their own consumer
            // ProGuard rules; proguard-rules.pro adds keep rules for the
            // WebView JS↔native bridge and the FileProvider.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Use the same official bundletool dependency as AGP to inspect the built AAB.
tasks.register('validateReleaseBundle', JavaExec) {
    dependsOn 'bundleRelease'
    classpath = rootProject.buildscript.configurations.classpath
    mainClass = 'com.android.tools.build.bundletool.BundleToolMain'
    args 'validate', "--bundle=${layout.buildDirectory.get()}/outputs/bundle/release/app-release.aab"
}

tasks.register('dumpReleaseManifest', JavaExec) {
    dependsOn 'validateReleaseBundle'
    classpath = rootProject.buildscript.configurations.classpath
    mainClass = 'com.android.tools.build.bundletool.BundleToolMain'
    args 'dump', 'manifest', "--bundle=${layout.buildDirectory.get()}/outputs/bundle/release/app-release.aab", '--module=base'
    def manifestOutput = new ByteArrayOutputStream()
    standardOutput = manifestOutput
    doLast {
        file("${layout.buildDirectory.get()}/outputs/bundle/release/AndroidManifest.xml").text = manifestOutput.toString('UTF-8')
    }
}
