<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>UDF Mail</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; text-align: center; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(1100px 520px at 50% -12%, rgba(216,38,28,.55), transparent 62%),
          linear-gradient(180deg, #1b1815 0%, #101010 100%); color: #fbf7f0; padding: 8vw;
      }
      .mark { width: 96px; height: 96px; border-radius: 18px; box-shadow: 0 0 0 3px #f7c600; }
      h1 { font-size: 1.15rem; margin: 0; letter-spacing: .02em; }
      p { margin: 0; opacity: .8; font-size: .9rem; line-height: 1.5; max-width: 34ch; }
      .retry {
        margin-top: 6px; appearance: none; border: 0; border-radius: 10px; padding: 12px 22px;
        font: inherit; font-weight: 700; color: #fff; background: #d8261c; cursor: pointer;
      }
      .retry:active { background: #a3170e; }
    </style>
  </head>
  <body>
    <img class="mark" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23d8261c'/><text x='50' y='66' font-family='system-ui' font-size='52' font-weight='700' text-anchor='middle' fill='white'>U</text></svg>" alt="UDF" />
    <h1>Mail &middot; UDF Party (Secure)</h1>
    <p>No connection. UDF Mail needs the internet to reach your secure mailbox. Check your network and try again.</p>
    <button class="retry" onclick="location.href='https://mail.udf-party.co.za'">Retry</button>
    <noscript><p>Enable JavaScript, or open your browser and visit mail.udf-party.co.za.</p></noscript>
  </body>
</html>
