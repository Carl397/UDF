services:
  db:
    # PostGIS image gives us geographic types + spatial indexes for map/heat-map queries.
    image: postgis/postgis:16-3.4
    container_name: party_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-party}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-party_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-party}
    ports:
      # 5433 by default: avoids clashing with a PostgreSQL already running on the host's 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-party} -d ${POSTGRES_DB:-party}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
