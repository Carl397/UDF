# ═══════════════════════════════════════════════════════════════════════════
# UDF — nginx site (public HTTPS on crm.udf-party.co.za + legacy IP)
# ═══════════════════════════════════════════════════════════════════════════
# Install:
#   sudo cp deploy/nginx/udf.conf /etc/nginx/sites-available/udf
#   sudo ln -s /etc/nginx/sites-available/udf /etc/nginx/sites-enabled/udf
#   sudo nginx -t            # MUST pass before reloading
#   sudo systemctl reload nginx
#
# ⚠⚠ PRE-FLIGHT — THIS VM ALSO RUNS A MAIL STACK (postfix/dovecot/opendkim) AND
#    NGINX IS ALREADY LISTENING ON :80/:443. Before enabling:
#      1. Run `sudo nginx -T` and note every `server` block, especially any
#         `listen ... default_server` on :80 and :443, and the mail vhosts.
#      2. Only ONE block per listen socket may be `default_server`. Requests to
#         https://<IP> send NO SNI, so they land on the :443 default_server.
#         • If nothing else is default on :443 → uncomment `default_server`
#           below so IP requests reach UDF.
#         • If a mail/other block is already default → DO NOT steal it. Instead
#           point a real domain's DNS at this IP and add it to `server_name`
#           (SNI then routes here), or serve UDF on a distinct port.
#      3. Do NOT reload until `nginx -t` passes AND you have confirmed the mail
#         web endpoints still resolve. Changing the default can break webmail.
# ═══════════════════════════════════════════════════════════════════════════

# Plain HTTP → HTTPS. (If another vhost is default_server on :80, keep this
# block non-default; it only redirects requests that match server_name/IP.)
#
# The ACME webroot location MUST come before the catch-all redirect — a
# server-level `return 301` fires in the rewrite phase and would swallow the
# challenge before nginx ever reaches a location block. certbot renew drops
# tokens under /var/www/letsencrypt/.well-known/acme-challenge/ twice a day.
server {
    listen 80;
    listen [::]:80;
    server_name crm.udf-party.co.za 102.68.98.129;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Uncomment ONLY if no other block is the :443 default_server (see above):
    # listen 443 ssl default_server;
    # listen [::]:443 ssl default_server;
    # NB: this VM runs nginx 1.18 — there is NO `http2 on;` directive (that is
    # nginx >=1.25.1; on 1.18 it is `listen 443 ssl http2;`). The existing :443
    # default_server (block-direct-ip) omits http2, so we match it and serve
    # HTTP/1.1 to avoid "duplicate listen options" on the shared :443 socket.
    server_name crm.udf-party.co.za 102.68.98.129;

    # Let's Encrypt cert for crm.udf-party.co.za. SNI-routed clients (browsers and
    # the APK once it is rebuilt with NEXT_PUBLIC_API_BASE=https://crm.udf-party.co.za/api)
    # land here and get a publicly trusted certificate. No-SNI IP-literal clients
    # still complete the handshake against block-direct-ip.conf's self-signed UDF
    # cert (SAN: IP Address:102.68.98.129) before being routed here by Host, so
    # the legacy IP path keeps working untouched.
    ssl_certificate     /etc/letsencrypt/live/crm.udf-party.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.udf-party.co.za/privkey.pem;
    # Fallback while the LE cert has not been issued yet (initial cutover):
    # ssl_certificate     /etc/udf/tls/udf.crt;
    # ssl_certificate_key /etc/udf/tls/udf.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:UDFSSL:10m;
    ssl_session_timeout 1h;

    # Edge hardening. A real Let's Encrypt cert is now live for
    # crm.udf-party.co.za, so HSTS is safe. nginx is the SINGLE source of
    # HSTS + CSP for this vhost: it covers the static export (which helmet never
    # touches) and the proxied /api + /healthz responses (helmet's own copies are
    # stripped below so clients never see duplicate headers). Backend
    # ENABLE_HSTS stays false so the app does not also emit Strict-Transport-Security.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # CSP for the Next.js static export: the App Router injects INLINE RSC scripts
    # (self.__next_f.push) and React emits inline style= attrs, so 'unsafe-inline'
    # is REQUIRED for script/style or hydration breaks. Everything else is locked
    # to same-origin; frame-ancestors 'none' mirrors X-Frame-Options DENY.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; upgrade-insecure-requests" always;

    # Static frontend: Next.js `output: export` → out/, shipped off-box.
    root /var/www/udf/frontend;
    index index.html;

    # Resident reports attach photo/audio/video — allow a reasonable body size
    # (must be >= the backend's express.json limit and any multipart handling).
    client_max_body_size 25m;

    # API reverse proxy → backend on loopback. No trailing path on proxy_pass,
    # so the original /api/... URI is preserved (the app mounts routes at /api).
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        # Strip helmet's CSP/HSTS so the server-level headers above are the only
        # copies on proxied responses (no duplicate security headers).
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
    }

    # Liveness probe (backend serves /healthz at the root, not under /api).
    location = /healthz {
        proxy_pass http://127.0.0.1:4000/healthz;
        proxy_set_header Host $host;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        access_log off;
    }

    # Pretty public links the backend prints on QR cards / invites / outbox mail
    # (PUBLIC_BASE_URL/v/<code>, /confirm/<token>). The STATIC EXPORT has no Next
    # rewrites, and usePublicToken() (frontend lib/publicLink.ts) reads the
    # trailing path segment client-side while the browser keeps the path form —
    # so the edge only has to serve the mount point's index.html WITHOUT changing
    # the URL. A dedicated location (not a server-level `rewrite ... /v/?code=$1
    # last`) avoids an internal-redirect cycle: the rewritten /v/index.html
    # re-matched ^/v/([^/]+)/?$ and looped to a 500. [^./]+ matches one
    # extension-less segment — public codes (UDF-XXX-XXX) and tokens (base64url)
    # never contain '.' or '/', while real files (/v/index.html, /v/index.txt)
    # fall through to `location /` and are served as-is.
    location ~ ^/(v|confirm)/[^./]+/?$ {
        try_files /$1/index.html =404;
    }

    # Direct APK download target: GET /api/public/download/apk counts the hit then
    # 302s to <PUBLIC_BASE_URL>/downloads/udf.apk, which is served here. Stored OUTSIDE
    # the frontend export (root /var/www/udf/frontend) so a frontend re-deploy never
    # wipes it. This is a dedicated prefix location so a MISSING file returns a clean
    # 404 instead of falling through `location /` to the SPA index.html shell (which
    # is what silently broke the download before). .apk is not in mime.types, so pin
    # the Android package content-type + force a download via Content-Disposition.
    # NOTE: any add_header here cancels the inherited server-level headers, so re-add
    # the ones that matter for a binary response.
    location = /downloads/udf-mail.apk {
        alias /var/www/udf/downloads/udf-mail.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="Mail - UDF Party.apk"' always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-cache" always;
    }

    location /downloads/ {
        alias /var/www/udf/downloads/;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=\"UDF-Party App.apk\"; filename*=UTF-8''UDF-Party%20App.apk" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Deny hidden files/dirs (/.env, /.git/*, /.well-known on :443) with a clean
    # 404 instead of the SPA shell — dotfile probes get an unambiguous negative,
    # not a 200 index.html. ACME http-01 is served on :80, so renewal is safe.
    location ~ /\. {
        return 404;
    }

    # Static/SPA fallback for client routes (e.g. /terms, /crm/moderation).
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
