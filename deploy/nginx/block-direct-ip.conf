# ═══════════════════════════════════════════════════════════════════════════
# block-direct-ip.conf — the host's "drop unknown Hosts" vhost, with the UDF
# certificate installed on the :443 default_server.
# ═══════════════════════════════════════════════════════════════════════════
# Provenance: this file was created by the hosting panel, NOT by the UDF kit.
# It is tracked here because UDF now DEPENDS on its certificate lines:
#
#   • A client that connects to https://102.68.98.129 sends **no SNI** — RFC 6066
#     forbids IP literals in the SNI extension, and Chromium/Android WebView
#     honour that. nginx therefore completes the TLS handshake on the :443
#     `default_server`, which is THIS block, and only afterwards selects the
#     virtual server from the `Host` header (which is how the UDF vhost serves
#     the request while this block owns the handshake).
#   • With the panel's snakeoil cert here, an IP-literal client is served
#     CN=vm478jzwg.yourlocaldomain.com (SAN: DNS only) → untrusted AND a
#     hostname mismatch. A browser lets a human click through that; the Android
#     WebView cannot, so the APK's API calls fail before any HTTP is exchanged.
#     Bundling a trust anchor in the APK does NOT help: no trust anchor can fix
#     a name mismatch.
#   • Presenting /etc/udf/tls/udf.crt (SAN: IP Address:102.68.98.129) instead
#     makes the handshake valid for IP-literal clients. `udf-ca.pem` — the same
#     certificate — is what the Android build bundles as its trust anchor
#     (frontend/android-overrides/udf_tls_ca.pem).
#
# Everything else is deliberately untouched: `server_name _` + `return 444`
# still drop requests whose Host matches no known vhost, the :80 block is
# unchanged, and the mail vhost (vm478jzwg.conf) keeps its own certificate
# because it is matched by SNI/Host rather than by default.
#
# Install (see RUNBOOK §9):
#   sudo cp block-direct-ip.conf /etc/nginx/sites-available/block-direct-ip.conf
#   sudo nginx -t && sudo systemctl reload nginx     # reload, never restart:
#                                                    # this box serves live mail
# ═══════════════════════════════════════════════════════════════════════════

# === BLOCK ALL DIRECT IP ACCESS ===
# Any request not matching a known domain gets dropped silently
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Drop connection silently (no response at all)
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # UDF's own cert (SAN = IP Address:102.68.98.129) so that no-SNI clients —
    # i.e. anyone connecting by IP, including the Android WebView — get a
    # certificate whose name actually matches. See the header above.
    ssl_certificate /etc/udf/tls/udf.crt;
    ssl_certificate_key /etc/udf/tls/udf.key;

    # Drop connection silently
    return 444;
}
