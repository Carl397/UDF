# ═══════════════════════════════════════════════════════════════════════════
# UDF — secure webmail vhost (https://mail.udf-party.co.za → Roundcube)
# ═══════════════════════════════════════════════════════════════════════════
# Serves the Roundcube webmail client for the on-box Dovecot/Postfix mail
# stack. Installed as a SEPARATE :443 vhost only — plain HTTP (:80) for
# mail.udf-party.co.za stays owned by udf-acme.conf (ACME webroot responder +
# 301 to https). DO NOT duplicate that server_name on :80 here.
#
# Install:
#   sudo cp deploy/nginx/udf-webmail.conf /etc/nginx/sites-available/udf-webmail
#   sudo ln -s /etc/nginx/sites-available/udf-webmail /etc/nginx/sites-enabled/udf-webmail
#   sudo nginx -t            # MUST pass before reloading
#   sudo systemctl reload nginx   # reload, never restart: this box serves live mail
#
# ⚠⚠ PRE-FLIGHT — THIS VM RUNS A LIVE MAIL STACK (postfix/dovecot/opendkim).
#    • NEVER steal default_server: block-direct-ip.conf keeps the :80/:443
#      defaults and drops unknown-Host requests with `return 444`. This vhost is
#      matched by SNI/Host = mail.udf-party.co.za, never by default.
#    • Cert: Let's Encrypt /etc/letsencrypt/live/mail.udf-party.co.za/ issued via
#      `certbot certonly --webroot -w /var/www/letsencrypt -d mail.udf-party.co.za`.
#    • Only /index.php executes as PHP; every other *.php returns 404. Roundcube
#      state (sqlite db, temp, logs) lives OUTSIDE the webroot in
#      /var/lib/udf-webmail (see deploy/scripts/setup-webmail.sh).
#    • nginx action is always `reload`, never `restart`.
# ═══════════════════════════════════════════════════════════════════════════

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mail.udf-party.co.za;

    # Let's Encrypt certificate for the mail host (see header pre-flight).
    ssl_certificate     /etc/letsencrypt/live/mail.udf-party.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.udf-party.co.za/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:MAIL_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root  /var/www/udf/webmail;
    index index.php index.html;

    # Attachment upload headroom (Roundcube max_message_size is 20M).
    client_max_body_size 25M;

    # ── Security headers ────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ── Deny direct access to internal / sensitive paths ────────────────────
    location ~ /\.            { deny all; }
    location ~ ^/(config|temp|logs|SQL|bin|installer|vendor|program/lib)/ { deny all; }

    # ── Front controller: route everything through index.php ───────────────
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # ── ONLY index.php runs as PHP; all other *.php are blocked ────────────
    location = /index.php {
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param HTTPS           on;
        # Real client IP / scheme for Roundcube rate limiting (proxy is loopback).
        fastcgi_param HTTP_X_FORWARDED_FOR   $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass  unix:/run/php/php8.1-fpm-roundcube.sock;
        fastcgi_read_timeout 120;
    }

    # Block any other PHP file from being executed or served.
    location ~ \.php$ { return 404; }
}
