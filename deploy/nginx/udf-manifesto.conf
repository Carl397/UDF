# ═══════════════════════════════════════════════════════════════════════════
# UDF — public manifesto site vhost (https://udf-party.co.za + www redirect)
# ═══════════════════════════════════════════════════════════════════════════
# Serves the static 4-page election-manifesto site (workspace `website/`,
# deployed to /var/www/udf/manifesto) on the apex domain.
#
# Install:
#   sudo cp deploy/nginx/udf-manifesto.conf /etc/nginx/sites-available/udf-manifesto
#   sudo ln -s /etc/nginx/sites-available/udf-manifesto /etc/nginx/sites-enabled/udf-manifesto
#   sudo nginx -t            # MUST pass before reloading
#   sudo systemctl reload nginx   # reload, never restart: this box serves live mail
#
# Dependencies / pre-flight:
#   • Plain-HTTP (:80) for udf-party.co.za / www is owned by udf-acme.conf, which
#     serves /.well-known/acme-challenge/ from /var/www/letsencrypt and 301s
#     everything else to https://$host. Do NOT duplicate those server_names on
#     :80 here — conflicting server_name on the same socket silently routes
#     ACME challenges to the wrong block and breaks renewals.
#   • The certificate MUST exist before nginx -t passes (ssl_certificate paths
#     below). Issue it first:
#       sudo certbot certonly --webroot -w /var/www/letsencrypt \
#         -d udf-party.co.za -d www.udf-party.co.za -n --agree-tos \
#         --email jnefdt7@gmail.com --no-eff-email
#     certbot.timer then renews it via the udf-acme.conf :80 responder.
#   • DO NOT add default_server here: block-direct-ip.conf owns the :80/:443
#     defaults (no-SNI IP clients + drop unknown Hosts), and the mail vhost
#     (vm478jzwg.conf) must keep resolving by SNI/Host.
#   • nginx 1.18: no `http2 on;` directive, and the :443 default_server omits
#     http2 — match it (plain `listen 443 ssl;`) to avoid "duplicate listen
#     options" on the shared socket.
# ═══════════════════════════════════════════════════════════════════════════

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name udf-party.co.za;

    ssl_certificate     /etc/letsencrypt/live/udf-party.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/udf-party.co.za/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:MANIFESTOSSL:10m;
    ssl_session_timeout 1h;

    # Edge hardening. HSTS is safe here: real LE cert, apex only — deliberately
    # WITHOUT includeSubDomains so a future problem on another subdomain's cert
    # cannot be amplified into a browser-side lockout.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Static manifesto site: website/ shipped off-box (see RUNBOOK).
    root /var/www/udf/manifesto;
    index index.html;

    # Immutable-ish assets (css/js/images) cache for a week; HTML stays
    # uncached so manifesto edits go out on next request.
    location ~* \.(?:png|jpe?g|svg|webp|css|js)$ {
        expires 7d;
        access_log off;
    }

    # Pure static site — no SPA fallback: unknown paths 404 instead of
    # silently serving index.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}

# www → apex canonicalisation (same cert covers both SANs).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.udf-party.co.za;

    ssl_certificate     /etc/letsencrypt/live/udf-party.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/udf-party.co.za/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://udf-party.co.za$request_uri;
}
